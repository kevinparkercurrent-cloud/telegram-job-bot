[project]
name = "telegram-job-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3,<4",
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "openai>=1,<3",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "telethon>=1.36,<2",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
